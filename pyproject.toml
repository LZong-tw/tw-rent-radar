[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-rent-radar"
version = "0.1.0"
description = "Multi-platform Taiwan rental listing CLI tool"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "LZong"}]
keywords = ["taiwan", "rental", "crawler", "591", "rakuya", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/LZong-tw/tw-rent-radar"
Repository = "https://github.com/LZong-tw/tw-rent-radar"
Issues = "https://github.com/LZong-tw/tw-rent-radar/issues"

dependencies = [
    "click>=8.1",
    "sqlalchemy>=2.0",
    "rich>=13.0",
    "playwright>=1.40",
    "playwright-stealth>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]

[project.scripts]
tw-rent-radar = "tw_rent_radar.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests that hit real websites (deselect with '-m not e2e')",
]
addopts = "-m 'not e2e'"
